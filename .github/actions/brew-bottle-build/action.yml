name: Build and validate Homebrew bottle
description: >-
  Shared composite action that prepares Homebrew test-bot, restores/saves
  sccache, installs optional prebuilt runtime bottles, builds a single formula
  bottle, runs strict steps_output and Tier 1/2 validate_bottle checks, and
  uploads bottle artifacts.

inputs:
  formula:
    description: Formula name to build
    required: true
  backend:
    description: Backend label for cache/artifact naming (macos, linux, cuda, rocm)
    required: true
  variant:
    description: Validation variant name in .github/validation-specs.json
    required: false
    default: ""
  github-token:
    description: GitHub token for Homebrew setup and GHCR registry auth
    required: true
  use-sccache:
    description: Enable sccache compiler caching
    required: false
    default: "true"
  sccache-mode:
    description: "sccache backend: 'gha' (for non-container jobs) or 'disk' (for container jobs)"
    required: false
    default: "disk"
  runtime-artifact:
    description: Optional prebuilt runtime bottle artifact name to download and install first
    required: false
    default: ""
  artifact-name:
    description: Artifact name for uploaded bottle tarballs and JSON
    required: true
  rubygems-cache-prefix:
    description: Prefix for Homebrew Bundler RubyGems cache key
    required: true
  install-python:
    description: Install python3 via apt-get (needed in bare ghcr.io/homebrew/brew:main)
    required: false
    default: "false"
  free-disk-space:
    description: Reclaim unused runner disk space before heavy GPU compiles
    required: false
    default: "false"
  validate-bottle:
    description: Run Tier 1/2 validate_bottle.py headless verification when keg is present
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Reclaim unused disk space
      if: inputs.free-disk-space == 'true' && runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        df -h / || true
        for path in /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; do
          if [[ -e "${path}" ]]; then
            sudo rm -rf "${path}" 2>/dev/null || rm -rf "${path}" 2>/dev/null || true
          fi
        done
        df -h / || true

    - name: Set up Homebrew
      id: set-up-homebrew
      uses: Homebrew/actions/setup-homebrew@61b401267256bb9c047d6d1481b176d5772a0ba7 # 2026.11.23.1
      with:
        token: ${{ inputs.github-token }}

    - name: Cache Homebrew Bundler RubyGems
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.set-up-homebrew.outputs.gems-path }}
        key: ${{ inputs.rubygems-cache-prefix }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
        restore-keys: ${{ inputs.rubygems-cache-prefix }}-rubygems-

    - name: Install Python if requested
      if: inputs.install-python == 'true' && runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        if ! command -v python3 >/dev/null 2>&1; then
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3
        fi

    - name: Restore sccache disk directory
      if: inputs.use-sccache == 'true' && inputs.sccache-mode == 'disk'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: /tmp/sccache
        key: sccache-${{ inputs.backend }}-${{ inputs.formula }}-${{ github.sha }}
        restore-keys: |
          sccache-${{ inputs.backend }}-${{ inputs.formula }}-

    - name: Set up sccache
      if: inputs.use-sccache == 'true'
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

    - name: Export sccache path for Homebrew superenv
      id: sccache-path
      if: inputs.use-sccache == 'true' && inputs.sccache-mode == 'disk'
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p /tmp/sccache
        sccache_bin="${SCCACHE_PATH:-$(command -v sccache || true)}"
        if [[ -n "${sccache_bin}" && -x "${sccache_bin}" ]]; then
          echo "path=${sccache_bin}" >> "${GITHUB_OUTPUT}"
        fi

    - name: Locate tap checkout
      id: tap-dir
      shell: bash
      run: |
        set -euo pipefail
        tap_dir="$(brew --repository)/Library/Taps/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
        echo "path=${tap_dir}" >> "${GITHUB_OUTPUT}"

    - name: Prepare test-bot environment
      shell: bash
      run: |
        set -euo pipefail
        brew test-bot --only-cleanup-before
        brew test-bot --only-setup

    - name: Download prebuilt runtime bottle
      if: inputs.runtime-artifact != ''
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ inputs.runtime-artifact }}
        path: /tmp/prebuilt-runtime-bottle

    - name: Install prebuilt runtime bottle
      if: inputs.runtime-artifact != ''
      shell: bash
      env:
        TAP_DIR: ${{ steps.tap-dir.outputs.path }}
      run: |
        set -euo pipefail
        shopt -s nullglob
        bottles=(/tmp/prebuilt-runtime-bottle/*.bottle*.tar.gz)
        if (( ${#bottles[@]} > 0 )); then
          brew install --formula "${bottles[0]}"
        fi
        jsons=(/tmp/prebuilt-runtime-bottle/*.bottle*.json)
        if (( ${#jsons[@]} > 0 )); then
          (cd "${TAP_DIR}" && brew bottle --merge --write --no-commit --no-all-checks "${jsons[0]}")
        fi

    - name: Base64-encode GITHUB_TOKEN
      id: registry
      shell: bash
      env:
        TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail
        token="$(printf '%s' "${TOKEN}" | base64 | tr -d '\n')"
        echo "::add-mask::${token}"
        echo "token=${token}" >> "${GITHUB_OUTPUT}"

    - name: Build bottle
      shell: bash
      env:
        TAP_DIR: ${{ steps.tap-dir.outputs.path }}
        HOMEBREW_SCCACHE_PATH: ${{ steps.sccache-path.outputs.path }}
        HOMEBREW_DOCKER_REGISTRY_TOKEN: ${{ steps.registry.outputs.token }}
        TESTING_FORMULAE: ${{ inputs.formula }}
      run: |
        set -euo pipefail
        cd "${TAP_DIR}"
        brew test-bot \
          --only-formulae \
          --testing-formulae="${TESTING_FORMULAE}" \
          --root-url=https://ghcr.io/v2/heretek-ai/tap

    - name: Fail on skipped or failed formula
      shell: bash
      env:
        TAP_DIR: ${{ steps.tap-dir.outputs.path }}
      run: |
        set -euo pipefail
        cd "${TAP_DIR}"
        if [[ ! -f steps_output.txt ]]; then
          echo "::error::brew test-bot did not write steps_output.txt"
          exit 1
        fi
        cat steps_output.txt
        if ! grep -qx 'All steps passed!' steps_output.txt; then
          echo "::error::brew test-bot reported skipped or failed steps"
          exit 1
        fi
        if ! compgen -G 'skipped_or_failed_formulae-*.txt' > /dev/null; then
          echo "::error::brew test-bot did not write skipped_or_failed_formulae output"
          exit 1
        fi
        if [[ -n "$(cat skipped_or_failed_formulae-*.txt)" ]]; then
          echo "::error::brew test-bot skipped formulae: $(cat skipped_or_failed_formulae-*.txt)"
          exit 1
        fi

    - name: Run Tier 1/2 bottle validation
      if: inputs.validate-bottle == 'true' && inputs.variant != ''
      shell: bash
      env:
        TAP_DIR: ${{ steps.tap-dir.outputs.path }}
        FORMULA: ${{ inputs.formula }}
        VARIANT: ${{ inputs.variant }}
      run: |
        set -euo pipefail
        cd "${TAP_DIR}"
        if ! command -v python3 >/dev/null 2>&1; then
          echo "::notice::python3 unavailable; skipping validate_bottle.py"
          exit 0
        fi
        if [[ ! -f .github/scripts/validate_bottle.py || ! -f .github/validation-specs.json ]]; then
          exit 0
        fi
        keg_dir="$(brew --prefix "${FORMULA}" 2>/dev/null || true)"
        if [[ -z "${keg_dir}" || ! -d "${keg_dir}" ]]; then
          echo "::notice::Keg for ${FORMULA} not installed after test-bot; skipping Tier 1/2 validation"
          exit 0
        fi
        python3 .github/scripts/validate_bottle.py \
          --keg "${keg_dir}" \
          --formula "${FORMULA}" \
          --variant "${VARIANT}" \
          --spec .github/validation-specs.json \
          --tiers 1,2 \
          --hardware absent \
          --out "${TAP_DIR}/validation-proof-${FORMULA}-${VARIANT}.json"

    - name: Show sccache statistics
      if: always() && inputs.use-sccache == 'true'
      shell: bash
      env:
        HOMEBREW_SCCACHE_PATH: ${{ steps.sccache-path.outputs.path }}
        FORMULA: ${{ inputs.formula }}
        BACKEND: ${{ inputs.backend }}
      run: |
        set -euo pipefail
        sccache_bin="${HOMEBREW_SCCACHE_PATH:-${SCCACHE_PATH:-$(command -v sccache || true)}}"
        if [[ -n "${sccache_bin}" && -x "${sccache_bin}" ]]; then
          {
            echo "### sccache stats (${FORMULA} / ${BACKEND})"
            echo '```'
            "${sccache_bin}" --show-stats || true
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
        fi

    - name: Upload bottle artifacts
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.artifact-name }}
        if-no-files-found: ignore
        path: |
          ${{ steps.tap-dir.outputs.path }}/*.bottle*.tar.gz
          ${{ steps.tap-dir.outputs.path }}/*.bottle*.json

    - name: Save sccache disk directory
      if: >-
        always() &&
        inputs.use-sccache == 'true' &&
        inputs.sccache-mode == 'disk' &&
        (github.ref == 'refs/heads/main' || startsWith(github.head_ref, 'autobump/'))
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: /tmp/sccache
        key: sccache-${{ inputs.backend }}-${{ inputs.formula }}-${{ github.sha }}
