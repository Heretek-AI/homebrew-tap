name: Test Brew Install & Run

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test-install-matrix:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon
          - formula: cachy-llama
            flags: ""
            os: macos-14
            name: "cachy-llama [macOS Metal arm64]"
            binaries: "llama-cli llama-server cachy-llama-cli cachy-llama-server"
          - formula: llama-ai
            flags: ""
            os: macos-14
            name: "llama-ai [macOS arm64]"
            binaries: "llama-ai"

          # Linux ARM64
          - formula: cachy-llama
            flags: ""
            os: ubuntu-24.04-arm
            name: "cachy-llama [Linux ARM64 CPU]"
            binaries: "llama-cli llama-server cachy-llama-cli cachy-llama-server"

          # Linux x64 (CachyLLama variants)
          - formula: cachy-llama
            flags: ""
            os: ubuntu-22.04
            name: "cachy-llama [Linux Vulkan RADV]"
            binaries: "llama-cli llama-server cachy-llama-cli cachy-llama-server"
          - formula: cachy-llama
            flags: "--with-cpu"
            os: ubuntu-22.04
            name: "cachy-llama [Linux CPU x64]"
            binaries: "llama-cli llama-server cachy-llama-cli cachy-llama-server"
          - formula: cachy-llama
            flags: "--with-rocm-gfx1151"
            os: ubuntu-22.04
            name: "cachy-llama [Linux ROCm gfx1151 Strix Halo]"
            binaries: "llama-cli llama-server cachy-llama-cli cachy-llama-server"
          - formula: cachy-llama
            flags: "--with-rocm-gfx1150"
            os: ubuntu-22.04
            name: "cachy-llama [Linux ROCm gfx1150 Strix Point]"
            binaries: "llama-cli llama-server cachy-llama-cli cachy-llama-server"
          - formula: cachy-llama
            flags: "--with-rocm-gfx120X"
            os: ubuntu-22.04
            name: "cachy-llama [Linux ROCm gfx120X RDNA4]"
            binaries: "llama-cli llama-server cachy-llama-cli cachy-llama-server"
          - formula: cachy-llama
            flags: "--with-rocm-gfx110X"
            os: ubuntu-22.04
            name: "cachy-llama [Linux ROCm gfx110X RDNA3]"
            binaries: "llama-cli llama-server cachy-llama-cli cachy-llama-server"
          - formula: cachy-llama
            flags: "--with-rocm-gfx103X"
            os: ubuntu-22.04
            name: "cachy-llama [Linux ROCm gfx103X RDNA2]"
            binaries: "llama-cli llama-server cachy-llama-cli cachy-llama-server"
          - formula: cachy-llama
            flags: "--with-rocm-gfx90a"
            os: ubuntu-22.04
            name: "cachy-llama [Linux ROCm gfx90a CDNA2]"
            binaries: "llama-cli llama-server cachy-llama-cli cachy-llama-server"

          # Linux x64 (ROCmFPX variants)
          - formula: rocmfpx
            flags: ""
            os: ubuntu-22.04
            name: "rocmfpx [Linux ROCm gfx1151 Default]"
            binaries: "llama-cli llama-server rocmfpx-cli rocmfpx-server"
          - formula: rocmfpx
            flags: "--with-gfx1150"
            os: ubuntu-22.04
            name: "rocmfpx [Linux ROCm gfx1150 Strix Point]"
            binaries: "llama-cli llama-server rocmfpx-cli rocmfpx-server"
          - formula: rocmfpx
            flags: "--with-gfx120X"
            os: ubuntu-22.04
            name: "rocmfpx [Linux ROCm gfx120X RDNA4]"
            binaries: "llama-cli llama-server rocmfpx-cli rocmfpx-server"
          - formula: rocmfpx
            flags: "--with-gfx110X"
            os: ubuntu-22.04
            name: "rocmfpx [Linux ROCm gfx110X RDNA3]"
            binaries: "llama-cli llama-server rocmfpx-cli rocmfpx-server"
          - formula: rocmfpx
            flags: "--with-gfx103X"
            os: ubuntu-22.04
            name: "rocmfpx [Linux ROCm gfx103X RDNA2]"
            binaries: "llama-cli llama-server rocmfpx-cli rocmfpx-server"
          - formula: rocmfpx
            flags: "--with-gfx90a"
            os: ubuntu-22.04
            name: "rocmfpx [Linux ROCm gfx90a CDNA2]"
            binaries: "llama-cli llama-server rocmfpx-cli rocmfpx-server"
          - formula: rocmfpx
            flags: "--with-gfx908"
            os: ubuntu-22.04
            name: "rocmfpx [Linux ROCm gfx908 CDNA1]"
            binaries: "llama-cli llama-server rocmfpx-cli rocmfpx-server"

          # Linux x64 (llama-ai)
          - formula: llama-ai
            flags: ""
            os: ubuntu-22.04
            name: "llama-ai [Linux x64 Turnkey Bundle]"
            binaries: "llama-ai"

    name: ${{ matrix.name }}
    steps:
      - name: Checkout tap repository
        uses: actions/checkout@v4

      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@master

      - name: Trust Tap
        run: |
          brew trust heretek-ai/tap

      - name: Install Formula
        run: |
          mkdir -p "$HOME/.cache/brew_tmp"
          export HOMEBREW_TEMP="$HOME/.cache/brew_tmp"
          echo "Installing ${{ matrix.formula }} ${{ matrix.flags }}..."
          brew install ${{ matrix.formula }} ${{ matrix.flags }} --verbose || {
            echo "::warning::Installation skipped or pending release asset for ${{ matrix.name }}"
            exit 0
          }

      - name: Verify Installed Executables
        run: |
          for bin in ${{ matrix.binaries }}; do
            if command -v "$bin" >/dev/null 2>&1; then
              echo "=== Verifying $bin --help ==="
              "$bin" --help 2>&1 | head -n 15
            else
              echo "::warning::Command $bin not in PATH"
            fi
          done

      - name: Run Formula Audit / Test
        run: |
          brew test ${{ matrix.formula }} || true
