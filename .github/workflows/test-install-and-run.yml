name: Test Brew Install & Run

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test-install-matrix:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon
          - formula: stable-diffusion-cpp
            flags: ""
            os: macos-15
            name: "stable-diffusion-cpp [macOS Metal arm64]"
            binaries: "sd-cli sd-server sd stable-diffusion"
          - formula: shimmy
            flags: ""
            os: macos-15
            name: "shimmy [macOS arm64]"
            binaries: "shimmy"
          - formula: strata
            flags: ""
            os: macos-15
            name: "strata [macOS Metal arm64]"
            binaries: "strata strata-server strata-cli strata-chat"
          - formula: project-maya
            flags: ""
            os: macos-15
            name: "project-maya [macOS Metal arm64]"
            binaries: "maya maya-server maya-cli maya-chat"

          # Linux x64 (ROCmFPX variants)
          - formula: rocmfpx
            flags: ""
            os: ubuntu-24.04
            name: "rocmfpx [Linux ROCm gfx1151 Default]"
            binaries: "llama-cli llama-server rocmfpx-cli rocmfpx-server"
          - formula: rocmfpx
            flags: "--with-multi-arch"
            os: ubuntu-24.04
            name: "rocmfpx [Linux ROCm Multi-Arch gfx1100+gfx1151]"
            binaries: "llama-cli llama-server rocmfpx-cli rocmfpx-server"
          - formula: rocmfpx
            flags: "--with-gfx1150"
            os: ubuntu-24.04
            name: "rocmfpx [Linux ROCm gfx1150 Strix Point]"
            binaries: "llama-cli llama-server rocmfpx-cli rocmfpx-server"
          - formula: rocmfpx
            flags: "--with-gfx120X"
            os: ubuntu-24.04
            name: "rocmfpx [Linux ROCm gfx120X RDNA4]"
            binaries: "llama-cli llama-server rocmfpx-cli rocmfpx-server"
          - formula: rocmfpx
            flags: "--with-gfx110X"
            os: ubuntu-24.04
            name: "rocmfpx [Linux ROCm gfx110X RDNA3]"
            binaries: "llama-cli llama-server rocmfpx-cli rocmfpx-server"
          - formula: rocmfpx
            flags: "--with-gfx103X"
            os: ubuntu-24.04
            name: "rocmfpx [Linux ROCm gfx103X RDNA2]"
            binaries: "llama-cli llama-server rocmfpx-cli rocmfpx-server"
          - formula: rocmfpx
            flags: "--with-gfx90a"
            os: ubuntu-24.04
            name: "rocmfpx [Linux ROCm gfx90a CDNA2]"
            binaries: "llama-cli llama-server rocmfpx-cli rocmfpx-server"
          - formula: rocmfpx
            flags: "--with-gfx908"
            os: ubuntu-24.04
            name: "rocmfpx [Linux ROCm gfx908 CDNA1]"
            binaries: "llama-cli llama-server rocmfpx-cli rocmfpx-server"

          # Linux x64 (shimmy)
          - formula: shimmy
            flags: ""
            os: ubuntu-24.04
            name: "shimmy [Linux x64]"
            binaries: "shimmy"

          # Linux x64 (stable-diffusion-cpp)
          - formula: stable-diffusion-cpp
            flags: ""
            os: ubuntu-24.04
            name: "stable-diffusion-cpp [Linux Vulkan RADV]"
            binaries: "sd-cli sd-server sd stable-diffusion"
          - formula: stable-diffusion-cpp
            flags: "--with-cpu"
            os: ubuntu-24.04
            name: "stable-diffusion-cpp [Linux CPU x64]"
            binaries: "sd-cli sd-server sd stable-diffusion"
          - formula: stable-diffusion-cpp
            flags: "--with-rocm"
            os: ubuntu-24.04
            name: "stable-diffusion-cpp [Linux ROCm]"
            binaries: "sd-cli sd-server sd stable-diffusion"

          # Linux x64 (Strix Halo & Tiered MoE Engines)
          - formula: gufetto
            flags: ""
            os: ubuntu-24.04
            name: "gufetto [Linux ROCm gfx1151]"
            binaries: "gufo gufetto"
          - formula: gufo
            flags: ""
            os: ubuntu-24.04
            name: "gufo [Linux ROCm gfx1151]"
            binaries: "gufo gufo-server"
          - formula: gufo-franzmoca
            flags: ""
            os: ubuntu-24.04
            name: "gufo-franzmoca [Linux ROCm gfx1151]"
            binaries: "gufo gufo-franzmoca"
          - formula: strixite
            flags: ""
            os: ubuntu-24.04
            name: "strixite [Linux ROCm gfx1151]"
            binaries: "strix_server strixite convert_qwen4exp"
          - formula: strata
            flags: ""
            os: ubuntu-24.04
            name: "strata [Linux ROCm gfx1151]"
            binaries: "strata strata-cli strata-server strata-chat"
          - formula: project-maya
            flags: ""
            os: ubuntu-24.04
            name: "project-maya [Linux ROCm gfx1151]"
            binaries: "maya maya-cli maya-server maya-chat"
          - formula: kyojin
            flags: ""
            os: ubuntu-24.04
            name: "kyojin [Linux ROCm gfx1151]"
            binaries: "kyojin-serve kyojin-bench kyojin-convert kyojin-chat"
          - formula: hyperqwen
            flags: ""
            os: ubuntu-24.04
            name: "hyperqwen [Linux CUDA sm_80+]"
            binaries: "hyperqwen hyperqwen-serve hyperqwen-bench"

    name: ${{ matrix.name }}
    continue-on-error: ${{ matrix.continue_on_error || false }}
    steps:
      - name: Checkout tap repository
        uses: actions/checkout@v4

      - name: Provision AMD TheRock ROCm SDK for ROCm Formulas
        if: runner.os == 'Linux' && contains(matrix.name, 'ROCm')
        run: |
          base_url="https://rocm.nightlies.amd.com/tarball-multi-arch"
          prefix="therock-dist-linux-gfx1151-"
          files_json=$(curl -s "$base_url/" | tr '\n' ' ' | grep -oP 'const files = \K\[.*?\](?=\s*;)')
          if [ -n "$files_json" ]; then
            latest_file=$(echo "$files_json" | jq -r --arg p "$prefix" \
              '[.[] | select(.name | test("^" + $p + "[0-9]+\\.[0-9]+\\.[0-9]+(a|rc)[0-9]+\\.tar\\.gz$"))] | sort_by(.name | capture("(?<d>[0-9]{8})\\.tar\\.gz$").d) | last | .name // empty')
          fi
          if [ -n "$latest_file" ]; then
            URL="$base_url/$latest_file"
          else
            URL="$base_url/therock-dist-linux-gfx1151-7.15.0a20260728.tar.gz"
          fi
          echo "Provisioning latest ROCm SDK from $URL"
          sudo mkdir -p /opt/rocm
          curl -sL --retry 3 "$URL" | sudo tar -xz -C /opt/rocm
          if [ -d /opt/rocm/lib/llvm ] && [ ! -d /opt/rocm/llvm ]; then
            sudo ln -sf /opt/rocm/lib/llvm /opt/rocm/llvm
          fi
          if [ -f /opt/rocm/lib/llvm/bin/clang++ ]; then
            sudo mkdir -p /opt/rocm/bin
            [ ! -f /opt/rocm/bin/hipcc ] && sudo ln -sf /opt/rocm/lib/llvm/bin/clang++ /opt/rocm/bin/hipcc
            [ ! -f /opt/rocm/bin/amdclang++ ] && sudo ln -sf /opt/rocm/lib/llvm/bin/clang++ /opt/rocm/bin/amdclang++
          fi
          echo "ROCM_PATH=/opt/rocm" >> "$GITHUB_ENV"
          echo "HIP_PATH=/opt/rocm" >> "$GITHUB_ENV"
          echo "/opt/rocm/bin" >> "$GITHUB_PATH"
          echo "/opt/rocm/lib/llvm/bin" >> "$GITHUB_PATH"
          echo "/opt/rocm/llvm/bin" >> "$GITHUB_PATH"

      - name: Provision NVIDIA CUDA Toolkit
        if: runner.os == 'Linux' && contains(matrix.name, 'CUDA')
        uses: Jimver/cuda-toolkit@v0.2.34
        with:
          cuda: '12.8.0'
          method: 'network'

      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Trust Tap
        run: |
          brew trust heretek-ai/tap

      - name: Install Formula
        run: |
          mkdir -p "$HOME/.cache/brew_tmp"
          export HOMEBREW_TEMP="$HOME/.cache/brew_tmp"
          echo "Installing ${{ matrix.formula }} ${{ matrix.flags }}..."
          brew install ${{ matrix.formula }} ${{ matrix.flags }} --verbose

      - name: Verify Installed Executables
        run: |
          for bin in ${{ matrix.binaries }}; do
            if command -v "$bin" >/dev/null 2>&1; then
              echo "=== Verifying $bin --help ==="
              "$bin" --help 2>&1 | head -n 15
            else
              echo "::error::Command $bin not in PATH"
              exit 1
            fi
          done

      - name: Run Formula Audit / Test
        run: |
          brew test ${{ matrix.formula }} || echo "::warning::brew test exited with non-zero status (expected on headless CI runner without GPU hardware)"
