name: Test Brew Install & Run

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test-install-matrix:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon
          - formula: cachy-llama
            flags: ""
            os: macos-14
            name: "cachy-llama [macOS Metal arm64]"
            binaries: "llama-cli llama-server cachy-llama-cli cachy-llama-server"
          - formula: llama-ai
            flags: ""
            os: macos-14
            name: "llama-ai [macOS arm64]"
            binaries: "llama-ai"
          - formula: stable-diffusion-cpp
            flags: ""
            os: macos-15
            name: "stable-diffusion-cpp [macOS Metal arm64]"
            binaries: "sd-cli sd-server sd stable-diffusion"

          # Linux ARM64
          - formula: cachy-llama
            flags: ""
            os: ubuntu-24.04-arm
            name: "cachy-llama [Linux ARM64 CPU]"
            binaries: "llama-cli llama-server cachy-llama-cli cachy-llama-server"

          # Linux x64 (CachyLLama variants)
          - formula: cachy-llama
            flags: ""
            os: ubuntu-24.04
            name: "cachy-llama [Linux Vulkan RADV]"
            binaries: "llama-cli llama-server cachy-llama-cli cachy-llama-server"
          - formula: cachy-llama
            flags: "--with-cpu"
            os: ubuntu-24.04
            name: "cachy-llama [Linux CPU x64]"
            binaries: "llama-cli llama-server cachy-llama-cli cachy-llama-server"
          - formula: cachy-llama
            flags: "--with-cuda-sm100"
            os: ubuntu-24.04
            name: "cachy-llama [Linux CUDA SM100 Blackwell]"
            binaries: "llama-cli llama-server cachy-llama-cli cachy-llama-server"
          - formula: cachy-llama
            flags: "--with-cuda-sm120"
            os: ubuntu-24.04
            name: "cachy-llama [Linux CUDA SM120 Blackwell RTX 50]"
            binaries: "llama-cli llama-server cachy-llama-cli cachy-llama-server"
          - formula: cachy-llama
            flags: "--with-cuda-sm90"
            os: ubuntu-24.04
            name: "cachy-llama [Linux CUDA SM90 Hopper]"
            binaries: "llama-cli llama-server cachy-llama-cli cachy-llama-server"
          - formula: cachy-llama
            flags: "--with-cuda-sm89"
            os: ubuntu-24.04
            name: "cachy-llama [Linux CUDA SM89 Ada Lovelace]"
            binaries: "llama-cli llama-server cachy-llama-cli cachy-llama-server"
          - formula: cachy-llama
            flags: "--with-cuda-sm86"
            os: ubuntu-24.04
            name: "cachy-llama [Linux CUDA SM86 Ampere]"
            binaries: "llama-cli llama-server cachy-llama-cli cachy-llama-server"
          - formula: cachy-llama
            flags: "--with-cuda-sm80"
            os: ubuntu-24.04
            name: "cachy-llama [Linux CUDA SM80 Ampere A100]"
            binaries: "llama-cli llama-server cachy-llama-cli cachy-llama-server"
          - formula: cachy-llama
            flags: "--with-cuda-sm75"
            os: ubuntu-24.04
            name: "cachy-llama [Linux CUDA SM75 Turing]"
            binaries: "llama-cli llama-server cachy-llama-cli cachy-llama-server"

          # Linux x64 (ROCmFPX variants)
          - formula: rocmfpx
            flags: ""
            os: ubuntu-24.04
            name: "rocmfpx [Linux ROCm gfx1151 Default]"
            binaries: "llama-cli llama-server rocmfpx-cli rocmfpx-server"
          - formula: rocmfpx
            flags: "--with-multi-arch"
            os: ubuntu-24.04
            name: "rocmfpx [Linux ROCm Multi-Arch gfx1100+gfx1151]"
            binaries: "llama-cli llama-server rocmfpx-cli rocmfpx-server"
          - formula: rocmfpx
            flags: "--with-gfx1150"
            os: ubuntu-24.04
            name: "rocmfpx [Linux ROCm gfx1150 Strix Point]"
            binaries: "llama-cli llama-server rocmfpx-cli rocmfpx-server"
          - formula: rocmfpx
            flags: "--with-gfx120X"
            os: ubuntu-24.04
            name: "rocmfpx [Linux ROCm gfx120X RDNA4]"
            binaries: "llama-cli llama-server rocmfpx-cli rocmfpx-server"
          - formula: rocmfpx
            flags: "--with-gfx110X"
            os: ubuntu-24.04
            name: "rocmfpx [Linux ROCm gfx110X RDNA3]"
            binaries: "llama-cli llama-server rocmfpx-cli rocmfpx-server"
          - formula: rocmfpx
            flags: "--with-gfx103X"
            os: ubuntu-24.04
            name: "rocmfpx [Linux ROCm gfx103X RDNA2]"
            binaries: "llama-cli llama-server rocmfpx-cli rocmfpx-server"
          - formula: rocmfpx
            flags: "--with-gfx90a"
            os: ubuntu-24.04
            name: "rocmfpx [Linux ROCm gfx90a CDNA2]"
            binaries: "llama-cli llama-server rocmfpx-cli rocmfpx-server"
          - formula: rocmfpx
            flags: "--with-gfx908"
            os: ubuntu-24.04
            name: "rocmfpx [Linux ROCm gfx908 CDNA1]"
            binaries: "llama-cli llama-server rocmfpx-cli rocmfpx-server"

          # Linux x64 (q38rocm dedicated formula)
          - formula: q38rocm
            flags: ""
            os: ubuntu-24.04
            name: "q38rocm [Linux ROCm gfx1151 Strix Halo]"
            binaries: "llama-cli llama-server q38rocm q38rocm-server q38rocm-cli"

          # Linux x64 (ciru-rocmfpx dedicated formula)
          - formula: ciru-rocmfpx
            flags: ""
            os: ubuntu-24.04
            name: "ciru-rocmfpx [Linux ROCm gfx1151 Default]"
            binaries: "llama-cli llama-server ciru-rocmfpx ciru-fpx-server ciru-fpx-cli"
          - formula: ciru-rocmfpx
            flags: "--with-kairic-edge"
            os: ubuntu-24.04
            name: "ciru-rocmfpx [Linux ROCm gfx1151 Kairic Edge]"
            binaries: "llama-server ciru-rocmfpx ciru-fpx-server"
          - formula: ciru-rocmfpx
            flags: "--with-promptforge"
            os: ubuntu-24.04
            name: "ciru-rocmfpx [Linux ROCm gfx1151 PromptForge]"
            binaries: "llama-server ciru-rocmfpx ciru-fpx-server"

          # Linux x64 (llama-ai)
          - formula: llama-ai
            flags: ""
            os: ubuntu-24.04
            name: "llama-ai [Linux x64 Turnkey Bundle]"
            binaries: "llama-ai"

          # Linux x64 (stable-diffusion-cpp)
          - formula: stable-diffusion-cpp
            flags: ""
            os: ubuntu-24.04
            name: "stable-diffusion-cpp [Linux Vulkan RADV]"
            binaries: "sd-cli sd-server sd stable-diffusion"
          - formula: stable-diffusion-cpp
            flags: "--with-cpu"
            os: ubuntu-24.04
            name: "stable-diffusion-cpp [Linux CPU x64]"
            binaries: "sd-cli sd-server sd stable-diffusion"
          - formula: stable-diffusion-cpp
            flags: "--with-rocm"
            os: ubuntu-24.04
            name: "stable-diffusion-cpp [Linux ROCm]"
            binaries: "sd-cli sd-server sd stable-diffusion"

    name: ${{ matrix.name }}
    steps:
      - name: Checkout tap repository
        uses: actions/checkout@v4

      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@master

      - name: Trust Tap
        run: |
          brew trust heretek-ai/tap

      - name: Install Formula
        id: install
        run: |
          mkdir -p "$HOME/.cache/brew_tmp"
          export HOMEBREW_TEMP="$HOME/.cache/brew_tmp"
          echo "Installing ${{ matrix.formula }} ${{ matrix.flags }}..."
          if brew install ${{ matrix.formula }} ${{ matrix.flags }} --verbose; then
            echo "installed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Installation skipped or pending release asset for ${{ matrix.name }}"
            echo "installed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify Installed Executables
        if: steps.install.outputs.installed == 'true'
        run: |
          for bin in ${{ matrix.binaries }}; do
            if command -v "$bin" >/dev/null 2>&1; then
              echo "=== Verifying $bin --help ==="
              "$bin" --help 2>&1 | head -n 15
            else
              echo "::warning::Command $bin not in PATH"
            fi
          done

      - name: Run Formula Audit / Test
        if: steps.install.outputs.installed == 'true'
        run: |
          brew test ${{ matrix.formula }} || echo "::warning::brew test exited with non-zero status (expected on headless CI runner without GPU hardware)"
