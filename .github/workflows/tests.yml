name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      formulae:
        description: "Comma-separated formula names to force-test (empty: detect changes)"
        required: false
        default: ""

permissions: {}

concurrency:
  # Include the head SHA so a stale queued run for an older commit cannot block
  # the current push (GitHub keeps a run queued while a self-hosted job waits).
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -xeuo pipefail {0}

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1

jobs:
  changes:
    name: Detect code changes
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Filter heavy CI paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            code:
              - 'Formula/**'
              - 'Casks/**'
              - 'cmd/**'
              - 'scripts/**'
              - 'tests/**'
              - 'utils/**'
              - 'docker/**'
              - '.github/**'
              - '!README.md'
              - '!CONTRIBUTING.md'
              - '!docs/**'
              - '!Brewfiles/**'

  syntax-audit:
    name: Syntax, style and strict audit
    needs: changes
    if: always() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.code == 'true')
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/homebrew/brew:main
      options: --privileged
    permissions:
      contents: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@61b401267256bb9c047d6d1481b176d5772a0ba7 # 2026.11.23.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ubuntu-latest-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ubuntu-latest-rubygems-

      - name: Locate tap checkout
        run: |
          tap_dir="$(brew --repository)/Library/Taps/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "TAP_DIR=${tap_dir}" >> "${GITHUB_ENV}"

      - name: Prepare test-bot environment
        run: |
          brew test-bot --only-cleanup-before
          brew test-bot --only-setup

      - name: Tap readall check
        run: |
          brew readall --aliases --os=all --arch=all heretek-ai/tap

      - name: Formula, cask and command style
        run: |
          cd "${TAP_DIR}"
          brew style Formula/ Casks/ cmd/

      - name: Strict formula audit
        run: |
          cd "${TAP_DIR}"
          brew audit --strict --tap=heretek-ai/tap

      - name: Strict cask audit
        run: |
          cd "${TAP_DIR}"
          brew audit --cask --strict --tap=heretek-ai/tap

      - name: Install Python for README verification
        run: |
          sudo apt-get update
          sudo apt-get install -y python3

      - name: Verify README is generated from current metadata
        run: |
          cd "${TAP_DIR}"
          python3 scripts/generate_readme.py --check

  test-scripts:
    name: Scripts, YAML and unit tests
    needs: changes
    if: always() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.code == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          pip install pytest pytest-cov pyyaml

      - name: Run script and toolchain unit tests
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python3 -m unittest discover -s tests/ -v
          python3 -m pytest tests/ -q

      - name: Lint shell scripts
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck .github/scripts/*.sh scripts/*.sh

      - name: Validate workflow YAML
        run: |
          python3 - <<'PY'
          import glob
          import yaml
          for path in sorted(glob.glob(".github/**/*.yml", recursive=True)):
              with open(path, encoding="utf-8") as handle:
                  yaml.safe_load(handle)
              print(f"ok {path}")
          PY

      - name: Run actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" -color

  bottles-macos:
    name: macOS bottles (hosted)
    needs: changes
    if: always() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.code == 'true')
    runs-on: macos-26
    permissions:
      actions: read
      checks: read
      contents: read
      packages: read
      pull-requests: read
    env:
      SCCACHE_GHA_ENABLED: "true"
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
      CMAKE_CUDA_COMPILER_LAUNCHER: sccache
      CMAKE_HIP_COMPILER_LAUNCHER: sccache
      RUSTC_WRAPPER: sccache
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@61b401267256bb9c047d6d1481b176d5772a0ba7 # 2026.11.23.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: macos-26-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: macos-26-rubygems-

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9

      - name: Locate tap checkout
        run: |
          tap_dir="$(brew --repository)/Library/Taps/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "TAP_DIR=${tap_dir}" >> "${GITHUB_ENV}"

      - name: Prepare test-bot environment
        run: |
          brew test-bot --only-cleanup-before
          brew test-bot --only-setup

      - name: Base64-encode GITHUB_TOKEN
        id: registry
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          token="$(printf '%s' "${TOKEN}" | base64 | tr -d '\n')"
          echo "::add-mask::${token}"
          echo "token=${token}" >> "${GITHUB_OUTPUT}"

      - name: Select changed macOS formulae
        id: formulae
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          FORCED_FORMULAE: ${{ github.event.inputs.formulae }}
        run: |
          cd "${TAP_DIR}"
          if [[ -n "${FORCED_FORMULAE}" ]]
          then
            python3 scripts/classify_changed_formulae.py --runner hosted-macos --formulae "${FORCED_FORMULAE}"
          elif [[ -n "${BASE_SHA}" && ! "${BASE_SHA}" =~ ^0+$ ]]
          then
            python3 scripts/classify_changed_formulae.py --runner hosted-macos --base "${BASE_SHA}" --head HEAD
          else
            python3 scripts/classify_changed_formulae.py --runner hosted-macos --all
          fi

      - name: Build macOS bottles
        if: steps.formulae.outputs.formulae != ''
        env:
          HOMEBREW_DOCKER_REGISTRY_TOKEN: ${{ steps.registry.outputs.token }}
        run: |
          cd "${TAP_DIR}"
          brew test-bot \
            --only-formulae \
            --testing-formulae="${{ steps.formulae.outputs.formulae }}" \
            --root-url=https://ghcr.io/v2/heretek-ai/tap

      - name: Fail on skipped or failed macOS formulae
        if: steps.formulae.outputs.formulae != ''
        run: |
          # test-bot exits 0 when it ignores a non-default formula failure;
          # its own summary is the authoritative result.
          cd "${TAP_DIR}"
          if [[ ! -f steps_output.txt ]]
          then
            echo "::error::brew test-bot did not write steps_output.txt"
            exit 1
          fi
          cat steps_output.txt
          if ! grep -qx 'All steps passed!' steps_output.txt
          then
            echo "::error::brew test-bot reported skipped or failed steps"
            exit 1
          fi
          if ! compgen -G 'skipped_or_failed_formulae-*.txt' > /dev/null
          then
            echo "::error::brew test-bot did not write skipped_or_failed_formulae output"
            exit 1
          fi
          if [[ -n "$(cat skipped_or_failed_formulae-*.txt)" ]]
          then
            echo "::error::brew test-bot skipped formulae: $(cat skipped_or_failed_formulae-*.txt)"
            exit 1
          fi

      - name: Upload macOS bottles
        if: always() && steps.formulae.outputs.formulae != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bottles_macos
          path: |
            ${{ env.TAP_DIR }}/*.bottle*.tar.gz
            ${{ env.TAP_DIR }}/*.bottle*.json

  bottles-linux:
    name: Linux CPU bottles (hosted)
    needs: [changes, toolchain-image]
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' || needs.changes.outputs.code == 'true') &&
      (needs.toolchain-image.result == 'success' || needs.toolchain-image.result == 'skipped')
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/homebrew/brew:main
      options: --privileged
    permissions:
      actions: read
      checks: read
      contents: read
      packages: read
      pull-requests: read
    env:
      SCCACHE_GHA_ENABLED: "true"
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
      CMAKE_CUDA_COMPILER_LAUNCHER: sccache
      CMAKE_HIP_COMPILER_LAUNCHER: sccache
      RUSTC_WRAPPER: sccache
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@61b401267256bb9c047d6d1481b176d5772a0ba7 # 2026.11.23.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ubuntu-latest-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ubuntu-latest-rubygems-

      - name: Install Python for formula classification
        run: |
          sudo apt-get update
          sudo apt-get install -y python3

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9

      - name: Locate tap checkout
        run: |
          tap_dir="$(brew --repository)/Library/Taps/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "TAP_DIR=${tap_dir}" >> "${GITHUB_ENV}"

      - name: Prepare test-bot environment
        run: |
          brew test-bot --only-cleanup-before
          brew test-bot --only-setup

      - name: Base64-encode GITHUB_TOKEN
        id: registry
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          token="$(printf '%s' "${TOKEN}" | base64 | tr -d '\n')"
          echo "::add-mask::${token}"
          echo "token=${token}" >> "${GITHUB_OUTPUT}"

      - name: Select changed hosted Linux formulae
        id: formulae
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          FORCED_FORMULAE: ${{ github.event.inputs.formulae }}
          EXCLUDE_CUDA_RUNTIME: ${{ needs.toolchain-image.outputs.cuda == 'true' && needs.toolchain-image.outputs.cuda_runtime == 'true' }}
        run: |
          cd "${TAP_DIR}"
          extra_args=()
          if [[ "${EXCLUDE_CUDA_RUNTIME}" == "true" ]]
          then
            extra_args+=(--exclude-runtime)
          fi
          if [[ -n "${FORCED_FORMULAE}" ]]
          then
            python3 scripts/classify_changed_formulae.py --runner hosted-linux "${extra_args[@]}" --formulae "${FORCED_FORMULAE}"
          elif [[ -n "${BASE_SHA}" && ! "${BASE_SHA}" =~ ^0+$ ]]
          then
            python3 scripts/classify_changed_formulae.py --runner hosted-linux "${extra_args[@]}" --base "${BASE_SHA}" --head HEAD
          else
            python3 scripts/classify_changed_formulae.py --runner hosted-linux "${extra_args[@]}" --all
          fi

      - name: Build hosted Linux bottles
        if: steps.formulae.outputs.formulae != ''
        env:
          HOMEBREW_DOCKER_REGISTRY_TOKEN: ${{ steps.registry.outputs.token }}
        run: |
          cd "${TAP_DIR}"
          brew test-bot \
            --only-formulae \
            --testing-formulae="${{ steps.formulae.outputs.formulae }}" \
            --root-url=https://ghcr.io/v2/heretek-ai/tap

      - name: Fail on skipped or failed Linux formulae
        if: steps.formulae.outputs.formulae != ''
        run: |
          # test-bot exits 0 when it ignores a non-default formula failure;
          # its own summary is the authoritative result.
          cd "${TAP_DIR}"
          if [[ ! -f steps_output.txt ]]
          then
            echo "::error::brew test-bot did not write steps_output.txt"
            exit 1
          fi
          cat steps_output.txt
          if ! grep -qx 'All steps passed!' steps_output.txt
          then
            echo "::error::brew test-bot reported skipped or failed steps"
            exit 1
          fi
          if ! compgen -G 'skipped_or_failed_formulae-*.txt' > /dev/null
          then
            echo "::error::brew test-bot did not write skipped_or_failed_formulae output"
            exit 1
          fi
          if [[ -n "$(cat skipped_or_failed_formulae-*.txt)" ]]
          then
            echo "::error::brew test-bot skipped formulae: $(cat skipped_or_failed_formulae-*.txt)"
            exit 1
          fi

      - name: Upload Linux bottles
        if: always() && steps.formulae.outputs.formulae != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bottles_linux
          path: |
            ${{ env.TAP_DIR }}/*.bottle*.tar.gz
            ${{ env.TAP_DIR }}/*.bottle*.json

  toolchain-image:
    name: Check toolchain images & plan matrices
    needs: changes
    if: always() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.code == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      cuda: ${{ steps.check.outputs.cuda }}
      rocm: ${{ steps.check.outputs.rocm }}
      cuda_matrix: ${{ steps.plan.outputs.cuda_matrix }}
      cuda_non_empty: ${{ steps.plan.outputs.cuda_non_empty }}
      cuda_runtime: ${{ steps.plan.outputs.cuda_runtime }}
      rocm_matrix: ${{ steps.plan.outputs.rocm_matrix }}
      rocm_non_empty: ${{ steps.plan.outputs.rocm_non_empty }}
      rocm_runtime: ${{ steps.plan.outputs.rocm_runtime }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check for published brew-cuda and brew-rocm images
        id: check
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cuda_ok=false
          rocm_ok=false
          if printf '%s' "${TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin >/dev/null 2>&1
          then
            if docker manifest inspect ghcr.io/heretek-ai/brew-cuda:13.5.0 >/dev/null 2>&1
            then
              cuda_ok=true
            else
              echo "::notice::ghcr.io/heretek-ai/brew-cuda:13.5.0 is not published yet; CUDA bottles will be skipped."
            fi
            if docker manifest inspect ghcr.io/heretek-ai/brew-rocm:10.3.0a20261126 >/dev/null 2>&1
            then
              rocm_ok=true
            else
              echo "::notice::ghcr.io/heretek-ai/brew-rocm:10.3.0a20261126 is not published yet; ROCm bottles will be skipped."
            fi
          fi
          echo "cuda=${cuda_ok}" >> "${GITHUB_OUTPUT}"
          echo "rocm=${rocm_ok}" >> "${GITHUB_OUTPUT}"

      - name: Plan CUDA and ROCm per-formula matrices
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          FORCED_FORMULAE: ${{ github.event.inputs.formulae }}
        run: |
          args=()
          if [[ -n "${FORCED_FORMULAE}" ]]
          then
            args=(--formulae "${FORCED_FORMULAE}")
          elif [[ -n "${BASE_SHA}" && ! "${BASE_SHA}" =~ ^0+$ ]]
          then
            args=(--base "${BASE_SHA}" --head HEAD)
          else
            args=(--all)
          fi

          cuda_all="$(python3 scripts/classify_changed_formulae.py --runner hosted-cuda --skip-bottled-runtime --format csv "${args[@]}")"
          cuda_json="$(python3 scripts/classify_changed_formulae.py --runner hosted-cuda --exclude-runtime --format json "${args[@]}")"
          rocm_all="$(python3 scripts/classify_changed_formulae.py --runner hosted-rocm --skip-bottled-runtime --format csv "${args[@]}")"
          rocm_json="$(python3 scripts/classify_changed_formulae.py --runner hosted-rocm --exclude-runtime --format json "${args[@]}")"

          cuda_non_empty=false
          [[ "${cuda_json}" != "[]" ]] && cuda_non_empty=true
          cuda_runtime=false
          [[ "${cuda_non_empty}" == "true" && ",${cuda_all}," == *",cuda-runtime,"* ]] && cuda_runtime=true
          rocm_non_empty=false
          [[ "${rocm_json}" != "[]" ]] && rocm_non_empty=true
          rocm_runtime=false
          [[ ",${rocm_all}," == *",rocm-runtime,"* ]] && rocm_runtime=true

          {
            echo "cuda_matrix=${cuda_json}"
            echo "cuda_non_empty=${cuda_non_empty}"
            echo "cuda_runtime=${cuda_runtime}"
            echo "rocm_matrix=${rocm_json}"
            echo "rocm_non_empty=${rocm_non_empty}"
            echo "rocm_runtime=${rocm_runtime}"
          } >> "${GITHUB_OUTPUT}"

  bottles-cuda-runtime:
    name: CUDA runtime bottle (hosted)
    needs: [changes, toolchain-image]
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' || needs.changes.outputs.code == 'true') &&
      needs.toolchain-image.outputs.cuda == 'true' &&
      needs.toolchain-image.outputs.cuda_runtime == 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/homebrew/brew:main
      options: --privileged
    permissions:
      actions: read
      checks: read
      contents: read
      packages: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@61b401267256bb9c047d6d1481b176d5772a0ba7 # 2026.11.23.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ubuntu-latest-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ubuntu-latest-rubygems-

      - name: Locate tap checkout
        run: |
          tap_dir="$(brew --repository)/Library/Taps/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "TAP_DIR=${tap_dir}" >> "${GITHUB_ENV}"

      - name: Prepare test-bot environment
        run: |
          brew test-bot --only-cleanup-before
          brew test-bot --only-setup

      - name: Base64-encode GITHUB_TOKEN
        id: registry
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          token="$(printf '%s' "${TOKEN}" | base64 | tr -d '\n')"
          echo "::add-mask::${token}"
          echo "token=${token}" >> "${GITHUB_OUTPUT}"

      - name: Build cuda-runtime bottle
        env:
          HOMEBREW_DOCKER_REGISTRY_TOKEN: ${{ steps.registry.outputs.token }}
        run: |
          cd "${TAP_DIR}"
          brew test-bot \
            --only-formulae \
            --testing-formulae="cuda-runtime" \
            --root-url=https://ghcr.io/v2/heretek-ai/tap

      - name: Fail on skipped or failed cuda-runtime
        run: |
          cd "${TAP_DIR}"
          if [[ ! -f steps_output.txt ]]
          then
            echo "::error::brew test-bot did not write steps_output.txt"
            exit 1
          fi
          cat steps_output.txt
          if ! grep -qx 'All steps passed!' steps_output.txt
          then
            echo "::error::brew test-bot reported skipped or failed steps"
            exit 1
          fi
          if ! compgen -G 'skipped_or_failed_formulae-*.txt' > /dev/null
          then
            echo "::error::brew test-bot did not write skipped_or_failed_formulae output"
            exit 1
          fi
          if [[ -n "$(cat skipped_or_failed_formulae-*.txt)" ]]
          then
            echo "::error::brew test-bot skipped formulae: $(cat skipped_or_failed_formulae-*.txt)"
            exit 1
          fi

      - name: Upload cuda-runtime bottle
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bottles_cuda_runtime
          path: |
            ${{ env.TAP_DIR }}/*.bottle*.tar.gz
            ${{ env.TAP_DIR }}/*.bottle*.json

  bottles-cuda:
    name: CUDA bottle (${{ matrix.formula }})
    needs: [changes, toolchain-image, bottles-cuda-runtime]
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' || needs.changes.outputs.code == 'true') &&
      needs.toolchain-image.outputs.cuda == 'true' &&
      needs.toolchain-image.outputs.cuda_non_empty == 'true' &&
      (needs.bottles-cuda-runtime.result == 'success' || needs.bottles-cuda-runtime.result == 'skipped')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        formula: ${{ fromJSON(needs.toolchain-image.outputs.cuda_matrix) }}
    container:
      image: ghcr.io/heretek-ai/brew-cuda:13.5.0
      options: --privileged
    permissions:
      actions: read
      checks: read
      contents: read
      packages: read
      pull-requests: read
    env:
      SCCACHE_GHA_ENABLED: "false"
      SCCACHE_DIR: /tmp/sccache
      SCCACHE_CACHE_SIZE: "4G"
      CUDA_HOME: /usr/local/cuda-13.5
      # Homebrew sanitises non-HOMEBREW_* variables before formula installs.
      HOMEBREW_CUDA_PATH: /usr/local/cuda-13.5
      HOMEBREW_SCCACHE_DIR: /tmp/sccache
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@61b401267256bb9c047d6d1481b176d5772a0ba7 # 2026.11.23.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ubuntu-latest-cuda-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ubuntu-latest-cuda-rubygems-

      - name: Restore sccache disk directory
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/sccache
          key: sccache-cuda-${{ matrix.formula }}-${{ github.sha }}
          restore-keys: |
            sccache-cuda-${{ matrix.formula }}-

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9

      - name: Export sccache path for Homebrew superenv
        run: |
          mkdir -p /tmp/sccache
          sccache_bin="${SCCACHE_PATH:-$(command -v sccache || true)}"
          if [[ -n "${sccache_bin}" && -x "${sccache_bin}" ]]
          then
            echo "HOMEBREW_SCCACHE_PATH=${sccache_bin}" >> "${GITHUB_ENV}"
          fi

      - name: Locate tap checkout
        run: |
          tap_dir="$(brew --repository)/Library/Taps/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "TAP_DIR=${tap_dir}" >> "${GITHUB_ENV}"

      - name: Prepare test-bot environment
        run: |
          brew test-bot --only-cleanup-before
          brew test-bot --only-setup

      - name: Download cuda-runtime bottle
        if: needs.bottles-cuda-runtime.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bottles_cuda_runtime
          path: /tmp/cuda-runtime-bottle

      - name: Install prebuilt cuda-runtime bottle
        if: needs.bottles-cuda-runtime.result == 'success'
        run: |
          shopt -s nullglob
          bottles=(/tmp/cuda-runtime-bottle/*.bottle*.tar.gz)
          if (( ${#bottles[@]} > 0 ))
          then
            brew install --formula "${bottles[0]}"
          fi
          jsons=(/tmp/cuda-runtime-bottle/*.bottle*.json)
          if (( ${#jsons[@]} > 0 ))
          then
            (cd "${TAP_DIR}" && brew bottle --merge --write --no-commit --no-all-checks "${jsons[0]}")
          fi

      - name: Base64-encode GITHUB_TOKEN
        id: registry
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          token="$(printf '%s' "${TOKEN}" | base64 | tr -d '\n')"
          echo "::add-mask::${token}"
          echo "token=${token}" >> "${GITHUB_OUTPUT}"

      - name: Build CUDA bottle
        # The ci-fast label is opt-in for PR iteration and compiles a single GPU
        # architecture; full multi-arch bottles are built on main and
        # workflow_dispatch, and the label must be removed before brew pr-pull
        # publishes bottles.
        env:
          HOMEBREW_DOCKER_REGISTRY_TOKEN: ${{ steps.registry.outputs.token }}
          HOMEBREW_FAST_ARCH: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci-fast') && '1' || '' }}
        run: |
          cd "${TAP_DIR}"
          brew test-bot \
            --only-formulae \
            --testing-formulae="${{ matrix.formula }}" \
            --root-url=https://ghcr.io/v2/heretek-ai/tap

      - name: Fail on skipped or failed CUDA formula
        run: |
          cd "${TAP_DIR}"
          formula="${{ matrix.formula }}"
          if [[ ! -f steps_output.txt ]]
          then
            echo "::error::brew test-bot did not write steps_output.txt"
            exit 1
          fi
          cat steps_output.txt
          if grep -qx 'All steps passed!' steps_output.txt
          then
            exit 0
          fi

          # A CUDA binary always carries NEEDED libcuda.so.1, which the host
          # NVIDIA driver provides. Hosted runners have no driver, and Homebrew's
          # Linux linkage checker allows only glibc/gcc system libraries, so this
          # single check cannot pass in CI. Accept it only when:
          #   - the linkage check is the only failed step,
          #   - it names libcuda.so.1 and nothing else, and
          #   - the real `brew test` (which test-bot skipped) passes.
          failed_steps="$(grep -v '^Warning: 1 failed step ignored!$' steps_output.txt | sed '/^[[:space:]]*$/d')"
          if [[ "${failed_steps}" != "brew linkage --test ${formula}" ]]
          then
            echo "::error::brew test-bot reported skipped or failed steps"
            exit 1
          fi
          if ! compgen -G 'skipped_or_failed_formulae-*.txt' > /dev/null
          then
            echo "::error::brew test-bot did not write skipped_or_failed_formulae output"
            exit 1
          fi
          skipped="$(cat skipped_or_failed_formulae-*.txt)"
          if [[ -n "${skipped}" && "${skipped}" != "${formula}" ]]
          then
            echo "::error::brew test-bot skipped formulae: ${skipped}"
            exit 1
          fi
          linkage="$(brew linkage --test "${formula}" 2>&1 || true)"
          unexpected="$(printf '%s\n' "${linkage}" | grep -vE '^(Missing libraries:|  libcuda\.so\.1)$' | grep -c . || true)"
          if [[ "${unexpected}" -ne 0 ]]
          then
            printf '%s\n' "${linkage}"
            echo "::error::unexpected linkage failure for ${formula}"
            exit 1
          fi
          brew test --verbose "${formula}"

      - name: Upload CUDA bottle
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bottles_cuda_${{ matrix.formula }}
          path: |
            ${{ env.TAP_DIR }}/*.bottle*.tar.gz
            ${{ env.TAP_DIR }}/*.bottle*.json

      - name: Save sccache disk directory
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/sccache
          key: sccache-cuda-${{ matrix.formula }}-${{ github.sha }}

