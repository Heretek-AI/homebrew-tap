name: Brew CI & Formula Audit

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  style-and-audit:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@55301c8cac0982bc2fbeb71275fa0b71b963bdb1 # main

      - name: Check Formula Style
        run: |
          brew style Formula/

      - name: Audit Formulae
        run: |
          TAP_NAME="${{ steps.set-up-homebrew.outputs.tap-name || github.repository }}"
          if [ "${{ matrix.os }}" = "macos-14" ]; then
            # On macOS, audit multi-platform formulas (Linux-only formulas declare depends_on :linux)
            for formula in shimmy stable-diffusion-cpp strata project-maya; do
              if [ -f "Formula/${formula}.rb" ]; then
                brew audit --strict --online "${TAP_NAME}/${formula}" || true
              fi
            done
          else
            brew audit --strict --online --tap="${TAP_NAME}"
          fi

  test-scripts:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Test Dependencies
        run: |
          pip install pytest pytest-cov

      - name: Run Script & Toolchain Unit Tests
        env:
          PYTHONIOENCODING: utf-8
        run: |
          pytest tests/ -v

      - name: Lint Shell Scripts
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck .github/scripts/*.sh
