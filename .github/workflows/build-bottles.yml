name: Build & Publish Linux Bottles (x86_64_linux)

on:
  workflow_dispatch:
    inputs:
      formula:
        description: "Formula name to bottle (gufetto, gufo, gufo-franzmoca, strixite, strata, project-maya, or all-rocm)"
        required: true
        default: "all-rocm"
  push:
    tags:
      - "release/*"
      - "bottles/*"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-bottles:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        formula:
          - gufetto
          - gufo
          - gufo-franzmoca
          - strixite
          - strata
          - project-maya
    steps:
      - name: Checkout Tap Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Filter Requested Formula
        id: filter
        run: |
          REQ="${{ github.event.inputs.formula }}"
          if [ -n "$REQ" ] && [ "$REQ" != "all-rocm" ] && [ "$REQ" != "${{ matrix.formula }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Free Runner Disk Space
        if: steps.filter.outputs.skip != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - name: Provision AMD TheRock ROCm 7+ SDK (gfx1151 / gfx1100 / gfx1201)
        if: steps.filter.outputs.skip != 'true'
        run: |
          THEROCK_VER="7.10.0a20251021"
          URL="https://rocm.nightlies.amd.com/tarball-multi-arch/therock-dist-linux-gfx1151-${THEROCK_VER}.tar.gz"
          sudo mkdir -p /opt/rocm
          curl -sL --retry 3 "$URL" | sudo tar -xz -C /opt/rocm
          echo "ROCM_PATH=/opt/rocm" >> "$GITHUB_ENV"
          echo "/opt/rocm/bin" >> "$GITHUB_PATH"
          echo "/opt/rocm/llvm/bin" >> "$GITHUB_PATH"

      - name: Set up Homebrew
        if: steps.filter.outputs.skip != 'true'
        uses: Homebrew/actions/setup-homebrew@master

      - name: Configure Tap & Audit Formula Style
        if: steps.filter.outputs.skip != 'true'
        run: |
          TAP_DIR="$(brew --repository)/Library/Taps/heretek-ai/homebrew-tap"
          mkdir -p "$(dirname "$TAP_DIR")"
          ln -sfn "$GITHUB_WORKSPACE" "$TAP_DIR"
          brew style "Formula/${{ matrix.formula }}.rb"
          brew audit --strict "heretek-ai/tap/${{ matrix.formula }}"

      - name: Build Formula from Source & Package Bottle
        if: steps.filter.outputs.skip != 'true'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          ROCM_PATH: "/opt/rocm"
        run: |
          EXTRA_FLAGS=""
          case "${{ matrix.formula }}" in
            gufo|gufo-franzmoca|gufetto)
              EXTRA_FLAGS="--with-znver4"
              ;;
            strixite)
              EXTRA_FLAGS="--with-portable-cpu"
              ;;
          esac
          
          echo "Building ${{ matrix.formula }} bottle..."
          brew install --build-bottle $EXTRA_FLAGS "heretek-ai/tap/${{ matrix.formula }}"
          brew test "heretek-ai/tap/${{ matrix.formula }}"
          
          # Generate bottle archive and json metadata
          RELEASE_TAG="bottles-${{ matrix.formula }}"
          ROOT_URL="https://github.com/${{ github.repository }}/releases/download/${RELEASE_TAG}"
          brew bottle --force-core-tap --root-url="${ROOT_URL}" --json "heretek-ai/tap/${{ matrix.formula }}"
          
          # Normalize filenames: replace double dashes in bottle tarball names
          for f in *--*.bottle.*.tar.gz; do
            [ -f "$f" ] && mv "$f" "${f/--/-}"
          done
          for j in *--*.bottle.json; do
            [ -f "$j" ] && mv "$j" "${j/--/-}"
          done
          ls -la *.bottle.*

      - name: Publish Bottle to GitHub Releases
        if: steps.filter.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bottles-${{ matrix.formula }}
          name: Bottles for ${{ matrix.formula }}
          files: |
            *.bottle.*.tar.gz
            *.bottle.json
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge Bottle Block into Formula
        if: steps.filter.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Use brew bottle --merge to inject the bottle DSL block into Formula/<name>.rb
          if ls *.bottle.json 1> /dev/null 2>&1; then
            brew bottle --merge --write *.bottle.json || true
            if [[ -n "$(git status --porcelain Formula/${{ matrix.formula }}.rb)" ]]; then
              git add "Formula/${{ matrix.formula }}.rb"
              git commit -m "chore(${{ matrix.formula }}): update bottle block [skip ci]"
              git push origin main || true
            fi
          fi

      - name: Upload Bottle Artifact
        if: steps.filter.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bottle-${{ matrix.formula }}
          path: |
            *.bottle.*.tar.gz
            *.bottle.json
