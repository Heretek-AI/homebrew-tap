name: Auto-Bump Formulae

on:
  schedule:
    # Run every 4 hours to check for new builder releases and upstream commits
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      target_builder:
        description: 'Target to sync (rocmfpx, shimmy, stable-diffusion-cpp, gufetto, gufo, gufo-franzmoca, strixite, strata, project-maya, kyojin, hyperqwen, or all)'
        required: false
        default: 'all'
      release_tag:
        description: 'Specific tag to sync (or latest)'
        required: false
        default: 'latest'
  repository_dispatch:
    types: [builder-release]

permissions:
  contents: write
  actions: write

jobs:
  bump-formulae:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Update Formulae
        id: update_step
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONIOENCODING: utf-8
        run: |
          TARGET="${{ github.event.inputs.target_builder || github.event.client_payload.builder || 'all' }}"
          TAG="${{ github.event.inputs.release_tag || github.event.client_payload.release_tag || 'latest' }}"
          
          echo "Syncing Formulae for: ${TARGET} (Tag: ${TAG})"
          python3 scripts/update_formulae.py --repo "${TARGET}" --tag "${TAG}"

      - name: Commit and push changes
        id: commit_step
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          if [[ -n "$(git status --porcelain Formula/)" ]]; then
            git add Formula/
            git commit -m "chore(formulae): auto-bump releases [skip ci]"
            git push origin main
            echo "committed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No formula updates detected."
            echo "committed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch Bottle Builds for Updated Formulae
        if: steps.commit_step.outputs.committed == 'true' && steps.update_step.outputs.has_updates == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATED: ${{ steps.update_step.outputs.updated_targets }}
        run: |
          IFS=',' read -ra TARGETS <<< "$UPDATED"
          for target in "${TARGETS[@]}"; do
            case "$target" in
              gufetto|gufo|gufo-franzmoca|strixite|strata|project-maya)
                echo "Triggering bottle build for: $target"
                gh workflow run build-bottles.yml -f formula="$target" || echo "Warning: could not dispatch build-bottles for $target"
                ;;
            esac
          done
