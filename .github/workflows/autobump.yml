name: Auto-Bump Formulae

on:
  schedule:
    # Run every 4 hours to check for new builder releases
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      target_builder:
        description: 'Builder repository to sync (cachyllama, rocmfpx, q38rocm, or all)'
        required: false
        default: 'all'
      release_tag:
        description: 'Specific tag to sync (or latest)'
        required: false
        default: 'latest'
  repository_dispatch:
    types: [builder-release]

jobs:
  bump-formulae:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Update Formulae
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TARGET="${{ github.event.inputs.target_builder || github.event.client_payload.builder || 'all' }}"
          TAG="${{ github.event.inputs.release_tag || github.event.client_payload.release_tag || 'latest' }}"
          
          echo "Syncing Formulae for: ${TARGET} (Tag: ${TAG})"
          python3 scripts/update_formulae.py --repo "${TARGET}" --tag "${TAG}"

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          if [[ -n "$(git status --porcelain Formula/)" ]]; then
            git add Formula/
            git commit -m "chore(formulae): auto-bump releases [skip ci]"
            git push origin main
          else
            echo "No formula updates detected."
          fi
