name: brew bump

# The optional GitHub App (`vars.APP_CLIENT_ID` + `secrets.APP_PRIVATE_KEY`) needs
# Contents and Pull requests write to push branches and open pull requests, and
# Issues write to manage the `autobump` label. Without the App the workflow
# falls back to `GITHUB_TOKEN`, but pull requests created with that token do not
# trigger the independent builder workflows.
on:
  schedule:
    # Release-tag and livecheck bumps, every six hours.
    - cron: "17 */6 * * *"
    # Commit-tracking and rolling/multi-asset bumps, every twelve hours.
    - cron: "43 */12 * * *"
  workflow_dispatch:
    inputs:
      target:
        description: 'Formula key to sync, or "all" to run scheduled bumps'
        required: false
        default: all
      release_tag:
        description: Release tag to sync, or "latest"
        required: false
        default: latest
      max_prs:
        description: Maximum number of per-formula PRs to open or update in one run
        required: false
        default: "5"
  repository_dispatch:
    types: [builder-release, upstream-update]

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  release-bump:
    name: Release and livecheck bumps
    # Runs every six hours and on manual dispatches that target "all":
    # `brew bump` discovers new release and livecheck versions itself and opens
    # one PR per formula/cask.
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '17 */6 * * *') ||
      (github.event_name == 'workflow_dispatch' && (inputs.target || 'all') == 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      APP_CONFIGURED: ${{ vars.APP_CLIENT_ID != '' }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        if: env.APP_CONFIGURED == 'true'
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@61b401267256bb9c047d6d1481b176d5772a0ba7 # 2026.11.23.1

      - name: Set up git
        id: git_setup
        uses: Homebrew/actions/git-user-config@61b401267256bb9c047d6d1481b176d5772a0ba7 # 2026.11.23.1

      - name: Ensure autobump label exists
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh label create autobump --color 0e8a16 --description "Automated version bump" --force

      - name: Bump formulae and casks
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          HOMEBREW_GIT_COMMITTER_NAME: ${{ steps.git_setup.outputs.name }}
          HOMEBREW_GIT_COMMITTER_EMAIL: ${{ steps.git_setup.outputs.email }}
          TAP_NAME: ${{ steps.set-up-homebrew.outputs.tap-name }}
        run: |
          tap_dir="$(brew --repository "${TAP_NAME}")"

          # rocm-runtime and cuda-runtime pin several tarballs and SHA256s in
          # one formula. Multi-asset formulae with paired binary assets are
          # handled by the per-formula updater job below.
          mapfile -t formulae < <(
            find "${tap_dir}/Formula" -maxdepth 1 -name '*.rb' -printf '%f\n' \
              | sed 's/\.rb$//' \
              | grep -vxE 'rocm-runtime|cuda-runtime|basalt|colibri|hipfire|infr|magnitude|stable-diffusion-cpp|uzu|zinc' \
              | sort \
              | sed "s#^#${TAP_NAME}/#"
          )

          brew bump --formula --no-fork --open-pr --bump-synced \
            "${formulae[@]}" 2>&1 | tee bump-output.txt

      - name: Label opened pull requests
        if: always()
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ ! -f bump-output.txt ]]; then
            exit 0
          fi
          mapfile -t pr_numbers < <(
            awk 'match($0, /https:\/\/github\.com\/[^[:space:]]+\/pull\/[0-9]+/) {
              url = substr($0, RSTART, RLENGTH)
              sub(/.*\//, "", url)
              print url
            }' bump-output.txt | sort -u
          )

          if (( ${#pr_numbers[@]} == 0 )); then
            echo "brew bump opened no pull requests; nothing to label."
            exit 0
          fi

          for pr in "${pr_numbers[@]}"; do
            echo "Adding 'autobump' label to pull request #${pr}"
            gh pr edit "${pr}" --add-label autobump
          done

  cask-bump:
    name: Cask release bumps (macOS)
    # Runs on macos-26 so `brew audit` has `hdiutil` available for `.dmg` casks.
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '17 */6 * * *') ||
      (github.event_name == 'workflow_dispatch' && (inputs.target || 'all') == 'all')
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      APP_CONFIGURED: ${{ vars.APP_CLIENT_ID != '' }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        if: env.APP_CONFIGURED == 'true'
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@61b401267256bb9c047d6d1481b176d5772a0ba7 # 2026.11.23.1

      - name: Set up git
        id: git_setup
        uses: Homebrew/actions/git-user-config@61b401267256bb9c047d6d1481b176d5772a0ba7 # 2026.11.23.1

      - name: Bump casks
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          HOMEBREW_GIT_COMMITTER_NAME: ${{ steps.git_setup.outputs.name }}
          HOMEBREW_GIT_COMMITTER_EMAIL: ${{ steps.git_setup.outputs.email }}
          TAP_NAME: ${{ steps.set-up-homebrew.outputs.tap-name }}
        run: |
          brew bump --no-fork --open-pr --cask --tap="${TAP_NAME}" 2>&1 | tee cask-bump-output.txt

      - name: Label opened cask pull requests
        if: always()
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ ! -f cask-bump-output.txt ]]; then
            exit 0
          fi
          mapfile -t pr_numbers < <(
            awk 'match($0, /https:\/\/github\.com\/[^[:space:]]+\/pull\/[0-9]+/) {
              url = substr($0, RSTART, RLENGTH)
              sub(/.*\//, "", url)
              print url
            }' cask-bump-output.txt | sort -u
          )

          for pr in "${pr_numbers[@]}"; do
            echo "Adding 'autobump' label to cask pull request #${pr}"
            curl -fsSL -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GH_REPO}/issues/${pr}/labels" \
              -d '{"labels":["autobump"]}' >/dev/null
          done

  per-formula-bump:
    name: Per-formula commit & multi-asset bumps
    # Runs every 12 hours, on upstream-update / builder-release dispatches, and
    # on manual dispatches. Opens or updates ONE deduplicated PR per formula
    # (`autobump/<formula>`) so one broken upstream never blocks other formulae.
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '43 */12 * * *') ||
      github.event_name == 'repository_dispatch' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      APP_CONFIGURED: ${{ vars.APP_CLIENT_ID != '' }}
      TARGET: ${{ github.event.client_payload.formula || github.event.client_payload.target || github.event.client_payload.builder || inputs.target || 'all' }}
      TAG: ${{ github.event.client_payload.release_tag || github.event.client_payload.tag || inputs.release_tag || 'latest' }}
      MAX_PRS: ${{ inputs.max_prs || '5' }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        if: env.APP_CONFIGURED == 'true'
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Set up git
        id: git_setup
        uses: Homebrew/actions/git-user-config@61b401267256bb9c047d6d1481b176d5772a0ba7 # 2026.11.23.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Ensure autobump labels exist
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh label create autobump --color 0e8a16 --description "Automated version bump" --force
          gh label create autobump-failed --color d73a4a --description "Automated bump failed CI build" --force

      - name: Detect and open deduplicated per-formula PRs
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TARGET: ${{ env.TARGET }}
          TAG: ${{ env.TAG }}
          MAX_PRS: ${{ env.MAX_PRS }}
        run: |
          if [[ "${TARGET}" == "all" ]]; then
            python3 scripts/update_formulae.py \
              --repo all \
              --skip-upstream-releases \
              --tag "${TAG}" \
              --max-updates "${MAX_PRS}" \
              --sync-pins \
              --output-json /tmp/updated-formulae.json
          else
            python3 scripts/update_formulae.py \
              --repo "${TARGET}" \
              --tag "${TAG}" \
              --sync-pins \
              --output-json /tmp/updated-formulae.json
          fi

          mapfile -t updated_list < <(
            python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("/tmp/updated-formulae.json")
          if p.is_file():
              for item in json.loads(p.read_text(encoding="utf-8")):
                  print(item["target"])
          PY
          )

          if (( ${#updated_list[@]} == 0 )); then
            echo "No formula updates detected."
            exit 0
          fi

          # Stash the combined working tree changes and replay one formula per branch
          git checkout -- .
          for formula in "${updated_list[@]}"; do
            branch="autobump/${formula}"
            git checkout -B "${branch}" origin/main

            python3 scripts/update_formulae.py \
              --repo "${formula}" \
              --tag "${TAG}" \
              --sync-pins

            if [[ -z "$(git status --porcelain -- "Formula/${formula}.rb" .github/upstream-pins.json)" ]]; then
              echo "No diff for ${formula}; skipping."
              continue
            fi

            title="chore(${formula}): automated upstream bump"
            git add -- "Formula/${formula}.rb" .github/upstream-pins.json
            git commit -m "${title}"
            git push --force-with-lease origin "${branch}"

            existing_pr="$(gh pr list --repo "${GH_REPO}" --head "${branch}" --state open --json number --jq '.[0].number // empty')"
            body="Automated upstream bump for \`${formula}\` produced by \`scripts/update_formulae.py\`.

          - Formula: **${formula}**
          - Tag: **${TAG}**
          - Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          Opened on deduplicated branch \`${branch}\` with label \`autobump\`. Once the independent builder workflows pass, \`brew auto-publish\` dispatches \`brew pr-pull\` automatically."

            if [[ -n "${existing_pr}" ]]; then
              echo "Updated existing PR #${existing_pr} on branch ${branch}"
              gh pr edit "${existing_pr}" --title "${title}" --body "${body}" --add-label autobump --remove-label autobump-failed || true
            else
              gh pr create \
                --base main \
                --head "${branch}" \
                --title "${title}" \
                --label autobump \
                --body "${body}"
            fi
          done
          git checkout main
